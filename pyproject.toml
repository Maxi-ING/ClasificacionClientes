[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segmentation"
version = "1.0.0"
description = "Análisis de compras y segmentación RFM con Python"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.8,<1.10",
  "matplotlib>=3.9,<4", "openpyxl>=3.1,<4", "pyarrow>=18,<24",
  "PyYAML>=6,<7", "joblib>=1.4,<2", "streamlit>=1.45,<2", "altair>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
segment-customers = "customer_segmentation.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
